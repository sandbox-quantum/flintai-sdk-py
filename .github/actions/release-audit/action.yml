name: Release audit
description: Install the hash-pinned release tooling and the SDK, then run make release-audit.
inputs:
  gitleaks-version:
    description: gitleaks release to install, verified against its published checksums
    required: false
    default: 8.30.1
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: "3.12"
    - name: Install gitleaks
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ inputs.gitleaks-version }}
      run: |
        base="gitleaks_${GITLEAKS_VERSION}"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        tmp="$(mktemp -d)"
        curl -fsSL "$url/${base}_linux_x64.tar.gz" -o "$tmp/${base}_linux_x64.tar.gz"
        curl -fsSL "$url/${base}_checksums.txt" -o "$tmp/checksums.txt"
        ( cd "$tmp" && grep "${base}_linux_x64.tar.gz" checksums.txt | sha256sum -c - )
        mkdir -p "$RUNNER_TEMP/bin"
        tar -xzf "$tmp/${base}_linux_x64.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --require-hashes -r requirements-release.txt
        pip install -e ".[all]"
    - name: Release audit
      shell: bash
      run: make release-audit
